name: Bootstrap Aeris Tokens v14 fork

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4

      - name: Import upstream v13 and apply v14 overlay
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 --branch v13 https://gitlab.com/aeris-fvtt/aeris-tokens.git /tmp/aeris-upstream

          rsync -a --delete \
            --exclude='.git' \
            --exclude='.bootstrap' \
            /tmp/aeris-upstream/ ./

          cp -a .bootstrap/overlay/. ./
          rm -rf .bootstrap

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Port Aeris Tokens to Foundry VTT v14"
          git push origin main
